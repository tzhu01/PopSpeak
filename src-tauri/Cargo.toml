[package]
name = "popspeak"
version = "0.4.2"
description = "CPU-only offline Chinese voice keyboard for Windows"
authors = ["PopSpeak Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "popspeak_lib"
# PopSpeak ships only on Windows desktop; mobile-oriented static/cdylib outputs
# add redundant links and artifacts without being consumed by the application.
crate-type = ["rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
transcribe-cpp = { version = "=0.1.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
flume = { version = "0.11", default-features = false, features = ["async"] }
async-trait = "0.1"
arboard = "3"
http = "1"
rusqlite = { version = "0.31", features = ["backup", "bundled"] }
chrono = "0.4"
url = "2"
tempfile = "3"
base64 = "0.22"
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
hound = "3.5"
pinyin = "0.11"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
ring = "0.17"
bzip2 = "0.5"
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security_Credentials",
] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = "thin"
strip = true
