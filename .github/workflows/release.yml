name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.14)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync version from tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG_INPUT" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG_INPUT#v}"
          export VERSION
          echo "Syncing version: $VERSION"

          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));p.version=process.env.VERSION;if(p.packages&&p.packages[''])p.packages[''].version=process.env.VERSION;fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n');"

          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version=process.env.VERSION;fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"

          node -e "const fs=require('fs');let c=fs.readFileSync('src-tauri/Cargo.toml','utf8');c=c.replace(/^version = \".*\"/m,'version = \"'+process.env.VERSION+'\"');fs.writeFileSync('src-tauri/Cargo.toml',c);"

          node -e "const fs=require('fs');let c=fs.readFileSync('src/lib/constants.ts','utf8');c=c.replace(/APP_VERSION = 'v[^']*'/,\"APP_VERSION = 'v\"+process.env.VERSION+\"'\");fs.writeFileSync('src/lib/constants.ts',c);"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Validate runtime integrity manifest
        shell: pwsh
        run: ./scripts/test-runtime-integrity.ps1

      - name: Prepare CPU sidecars and offline models
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch-whisper.ps1
          ./scripts/fetch-llama-server.ps1
          ./scripts/fetch-sensevoice.ps1
          ./scripts/fetch-funasr-nano.ps1

      - name: Block non-redistributable runtime binaries
        shell: pwsh
        run: ./scripts/assert-redistributable-runtime.ps1

      - name: Cache Tauri NSIS toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-${{ runner.os }}-${{ runner.arch }}-3.11-utils-0.5.3

      - name: Prepare verified NSIS toolchain
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare-nsis.ps1

      - name: Quality gate
        shell: pwsh
        run: |
          npm test
          npm run lint
          npm run format:check
          npm run build
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          ./scripts/test-sensevoice.ps1

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require and prepare Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'PopSpeak ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify signed release artifacts
        shell: pwsh
        run: |
          ./scripts/assert-windows-signature.ps1 -Path @(
            "src-tauri/target/release/popspeak.exe",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/resources/runtimes/whisper/whisper-cli.exe",
            "src-tauri/resources/runtimes/llama/llama-server.exe",
            "src-tauri/resources/runtimes/*/*.dll",
            "src-tauri/binaries/*.dll"
          )

      - name: Build and upload verified portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ./scripts/build-portable.ps1 -CreateZip -RequireSignature
          gh release upload $env:RELEASE_TAG ./dist-portable/PopSpeak.zip --clobber
