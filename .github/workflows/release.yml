name: Windows Binary Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing, reviewed binary-release tag (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: 'npm'

      - name: Verify reviewed tag and matching source versions
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG_INPUT" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG_INPUT"; then
            echo "The binary release tag does not exist: $RELEASE_TAG_INPUT" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG_INPUT^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag is not on the reviewed main branch." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG_INPUT#v}"
          export VERSION
          node -e 'const fs=require("fs");const v=process.env.VERSION;const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));const cfg=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8").match(/^version = "([^"]+)"/m);const constants=fs.readFileSync("src/lib/constants.ts","utf8").match(/APP_VERSION = \x27v([^\x27]+)\x27/);const actual={package:pkg.version,lock:lock.version,lockRoot:lock.packages?.[""]?.version,tauri:cfg.version,cargo:cargo?.[1],app:constants?.[1]};for(const [name,value] of Object.entries(actual)){if(value!==v){console.error(`${name} version ${value} does not match release tag v${v}`);process.exitCode=1}}if(cfg.bundle.targets.length!==1||cfg.bundle.targets[0]!=="nsis"){console.error("Release bundle must be NSIS-only");process.exitCode=1}'
          git diff --exit-code

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Validate runtime integrity manifest
        shell: pwsh
        run: ./scripts/test-runtime-integrity.ps1

      - name: Fetch pinned SenseVoice model and CPU runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-sensevoice.ps1

      - name: Verify lean NSIS asset allowlist, hashes, and licenses
        shell: pwsh
        run: ./scripts/assert-lean-nsis-assets.ps1

      - name: Cache Tauri NSIS toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: tauri-nsis-${{ runner.os }}-${{ runner.arch }}-3.11-utils-0.5.3

      - name: Prepare verified NSIS toolchain
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/prepare-nsis.ps1

      - name: Quality gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run lint
          npm run format:check
          npm run build
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
          ./scripts/test-sensevoice.ps1

      - name: Audit reviewed source tree
        shell: pwsh
        run: ./scripts/audit-source-release.ps1 -PublishRef HEAD

      - name: Install pinned cargo-deny
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit Windows Rust dependency graph
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo deny --config deny.toml --manifest-path src-tauri/Cargo.toml --locked check advisories

      - name: Require and prepare Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build signed NSIS installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run tauri -- build --bundles nsis

      - name: Verify signed installer and bundled native binaries
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -File -Filter "*$version*setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer for $version; found $($installers.Count)."
          }
          $installer = $installers[0]
          if ($installer.Length -lt 100MB) { throw 'Installer is unexpectedly small for offline SenseVoice and WebView2.' }
          ./scripts/verify-production-executable.ps1 -Executable 'src-tauri/target/release/popspeak.exe' -ExpectedVersion $version
          $signedPaths = @(
            'src-tauri/target/release/popspeak.exe',
            $installer.FullName,
            'src-tauri/binaries/onnxruntime.dll',
            'src-tauri/binaries/onnxruntime_providers_shared.dll',
            'src-tauri/binaries/sherpa-onnx-c-api.dll',
            'src-tauri/binaries/sherpa-onnx-cxx-api.dll'
          )
          foreach ($path in $signedPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing signed release file: $path" }
          }
          ./scripts/assert-windows-signature.ps1 -Path $signedPaths
          $sha = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Verified signed NSIS installer: $($installer.Name) ($sha)"

      - name: Create draft release with verified NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (gh release view $env:RELEASE_TAG *> $null) {
            throw "A release for $env:RELEASE_TAG already exists; refusing to overwrite it."
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -File -Filter "*$version*setup.exe")
          if ($installer.Count -ne 1) { throw 'Verified installer is missing.' }
          gh release create $env:RELEASE_TAG $installer[0].FullName "$($installer[0].FullName).sha256" `
            --draft --verify-tag --title "PopSpeak $env:RELEASE_TAG" `
            --notes 'Signed Windows x64 installer with bundled offline SenseVoice model and offline WebView2. Other recognition models are not bundled.'
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
